<script>
/* dubai.leeba.co has moved to shows.leeba.co. A device that still holds sales or
   status changes not yet sent stays here until they are sent, then moves. */
(function () {
  function pending() { try { return JSON.parse(localStorage.getItem("leeba.shj.outbox") || "[]").length; } catch (e) { return 0; } }
  function go() { location.replace("https://shows.leeba.co" + location.pathname + location.search + location.hash); }
  if (!pending()) return go();
  var t = setInterval(function () { if (!pending()) { clearInterval(t); go(); } }, 5000);
})();
</script>
